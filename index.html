<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="每日推送：正在前往最新日报。">
  <title>每日推送</title>
  <style>
    :root { --accent: #0d6b4f; --accent-strong: #063d30; --accent-soft: #dff4eb; --page: #f4f6f2; --surface: #fff; --text: #13201c; --muted: #65736d; --border: #dfe6e1; --shadow: 0 12px 36px rgba(24, 51, 41, .08); --radius-card: 18px; --space-card: 24px; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 50% 28%, var(--accent-soft), transparent 34%), var(--page); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; line-height: 1.7; }
    .card { width: min(440px, 100%); padding: 34px 28px; border: 1px solid var(--border); border-radius: var(--radius-card); background: var(--surface); box-shadow: var(--shadow); text-align: center; }
    .mark { width: 48px; height: 48px; margin: 0 auto 16px; display: grid; place-items: center; border-radius: 14px; background: var(--accent-soft); color: var(--accent-strong); font-weight: 900; }
    h1 { margin: 0; font-size: clamp(22px, 5vw, 28px); }
    p { margin: 8px 0 0; color: var(--muted); }
    a { color: var(--accent); font-weight: 700; text-underline-offset: 3px; }
    a:hover { color: var(--accent-strong); }
    a:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 3px; border-radius: 4px; }
    @media (max-width: 640px) { .card { padding: 28px 20px; } }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">日</div>
    <h1>正在前往最新日报</h1>
    <p>如果页面没有自动跳转，可<a id="latest" href="/archive/">查看历史归档</a>。</p>
  </main>
  <script>
    fetch('/reports/latest.json', { cache: 'no-store' })
      .then(function (response) { if (!response.ok) throw new Error('not found'); return response.json(); })
      .then(function (report) {
        document.getElementById('latest').href = report.path;
        window.location.replace(report.path);
      })
      .catch(function () { window.location.replace('/archive/'); });
  </script>
</body>
</html>
